name: Maintenance / tooling
description: Plan repository work such as CI, build, packaging, dependencies or repo configuration.
title: '[Maintenance]: '
labels: ['maintenance']
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CI / GitHub Actions
        - Build / packaging (NuGet, MSBuild)
        - Dependencies (Roslyn, SDK, packages)
        - Repository configuration (templates, labels, policies)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should be true once this is done, and why does it matter for the project?
    validations:
      required: true
