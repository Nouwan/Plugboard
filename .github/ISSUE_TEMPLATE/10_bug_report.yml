name: Bug report
description: Something not behaving as expected?
title: '[Bug]: '
labels: ['bug']
body:
  - type: checkboxes
    id: existing
    attributes:
      label: Is there an existing issue for this?
      options:
        - label: I have searched the existing issues
          required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: |
        What actually happens.
        For generator issues include the generated file from `obj/` (enable `<EmitCompilerGeneratedFiles>true</EmitCompilerGeneratedFiles>`).
        For analyzer issues include the diagnostic id (`SE00x`) and message.
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        Point us to a [minimal project which reproduces this issue](https://stackoverflow.com/help/mcve) hosted in a public GitHub repository,
        or paste the endpoint/group classes and `Program.cs` that show the problem.
      render: csharp
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SimpleEndpoints version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: .NET SDK version
      description: Output of `dotnet --version`
      placeholder: 10.0.400
    validations:
      required: true
  - type: input
    id: tfm
    attributes:
      label: Target framework
      description: Target framework(s) of the project using SimpleEndpoints.
      placeholder: net10.0
    validations:
      required: false
