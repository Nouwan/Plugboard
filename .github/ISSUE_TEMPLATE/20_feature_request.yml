name: Enhancement
description: Propose a change improvement or new feature
title: '[Enhancement]: '
labels: ['enhancement']
body:
  - type: checkboxes
    id: existing
    attributes:
      label: Is there an existing issue for this?
      options:
        - label: I have searched the existing issues
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe the problem.
      description: A clear and concise description of what the problem is. What can't you do today, or what is awkward? Motivating examples help us prioritize things.
      placeholder: I am trying to do [...] but [...]
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Describe the solution you'd like
      description: |
        A clear and concise description of what you want to happen: attribute shape, include any alternative solutions you've considered.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false
